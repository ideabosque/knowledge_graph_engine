[project]
name = "Knowledge-Graph-Engine"
version = "0.0.1"
requires-python = ">=3.8"
dependencies = [
    "silvaengine-utility>=0.0.1",
    "silvaengine-dynamodb-base>=0.0.1",
    "graphene>=3.3,<4",
    "graphql-core>=3.1,<3.3",
    "neo4j>=5.0,<6",
    "neo4j-graphrag>=1.0,<1.15",
    "openai>=1.0,<3",
    "numpy",
    "openpyxl",
    "python-dotenv",
    "pendulum>=3.0,<4",
    "promise",
    "nest-asyncio>=1.5",
]

[project.optional-dependencies]
postgresql = [
    "SQLAlchemy>=1.4",
    "psycopg2-binary>=2.9",
    "alembic>=1.10",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "python-dotenv>=1.0",
    "SQLAlchemy>=1.4",
    "psycopg2-binary>=2.9",
    "alembic>=1.10",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# The repo root also has top-level `migration/`, `docs/` and `build/`
# directories, which setuptools' flat-layout auto-discovery can't
# disambiguate from the real package without this. Without it, `pip install
# git+https://...` (a fresh clone, no pre-built wheel) fails: "Multiple
# top-level packages discovered in a flat-layout: ['migration',
# 'knowledge_graph_engine']" (or similar, depending on which dirs are present).
include = ["knowledge_graph_engine*"]

[tool.pytest.ini_options]
testpaths = ["knowledge_graph_engine/tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (DB, API)",
    "extract: Knowledge graph extraction tests",
    "search: Search and RAG tests",
]

[tool.pyright]
typeCheckingMode = "basic"
reportCallIssue = "none"
reportArgumentType = "none"
reportIndexIssue = "none"
reportAttributeAccessIssue = "none"
reportOptionalMemberAccess = "none"
reportGeneralTypeIssues = "none"
reportOptionalSubscript = "none"
reportAssignmentType = "none"
reportOptionalCall = "none"
